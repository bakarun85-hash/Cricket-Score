<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NSC Toss · Nakshatra Sports Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #060b16;
    --panel: #0f1b2e;
    --panel-edge: #182842;
    --cyan: #2dd4f0;
    --cyan-dim: #0e5866;
    --blue: #2f8fd6;
    --ball: #c8102e;
    --ink: #edeff5;
    --muted: #8ca0be;
    --faint: #4c5b76;
    --silver: #d7dee8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  body{
    background:
      radial-gradient(ellipse 900px 550px at 50% -10%, rgba(45,212,240,0.12), transparent 60%),
      radial-gradient(ellipse 700px 450px at 100% 110%, rgba(47,143,214,0.12), transparent 60%),
      var(--bg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; justify-content: center;
  }
  .wrap{ width: 100%; max-width: 460px; padding: 24px 20px 44px; text-align: center; }

  a.backlink{
    display:inline-flex; align-items:center; gap:6px;
    color: var(--muted); text-decoration:none; font-size: 12.5px;
    margin-bottom: 18px;
  }
  a.backlink:active{ opacity: 0.7; }

  .eyebrow{
    letter-spacing: 0.32em; font-size: 11px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 6px;
  }
  h1{
    margin: 0 0 8px;
    font-size: 34px; font-weight: 800; letter-spacing: 0.02em;
    color: var(--silver);
    text-shadow: 0 0 22px rgba(45,212,240,0.25);
  }
  .legend{
    color: var(--muted); font-size: 13.5px; margin-bottom: 34px;
  }
  .legend b{ color: var(--ink); font-weight: 600; }
  .legend .sep{ color: var(--faint); margin: 0 8px; }

  /* ---------- Coin ---------- */
  .coin-stage{
    perspective: 1400px;
    display: flex; justify-content: center;
    margin-bottom: 30px;
  }
  .coin{
    width: 240px; height: 240px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 4s cubic-bezier(.15,.85,.25,1);
  }
  .coin-face{
    position: absolute; inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 0 0 6px #cdd6e3,
      0 0 0 8px #0a1526,
      0 18px 40px -10px rgba(0,0,0,0.7),
      inset 0 0 30px rgba(0,0,0,0.35);
  }
  .coin-face.heads{
    background: radial-gradient(circle at 35% 30%, #1a5a78, #06202e 70%);
    transform: rotateY(0deg);
    overflow: hidden;
  }
  .coin-face.heads img{
    width: 100%; height: 100%; object-fit: cover;
  }
  .coin-face.tails{
    background: radial-gradient(circle at 35% 30%, #123a63, #050f1e 70%);
    transform: rotateY(180deg);
    flex-direction: column;
    gap: 6px;
  }
  .tails-star{ color: var(--cyan); font-size: 15px; line-height: 1; }
  .tails-nsc{
    font-size: 46px; font-weight: 800; letter-spacing: 0.02em;
    background: linear-gradient(180deg, #f3f7fc, #b9c6d8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(45,212,240,0.35);
  }
  .tails-sub{
    font-size: 9px; letter-spacing: 0.28em; color: var(--cyan); text-transform: uppercase;
  }

  .coin.spinning{
    transition: transform 4s cubic-bezier(.15,.85,.25,1);
  }

  /* ---------- Spin button ---------- */
  .spinbtn{
    width: 100%; max-width: 280px;
    height: 56px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #4fc3e8, #1a7bb8);
    color: #04141a; font-family: 'Space Grotesk', sans-serif;
    font-weight: 700; font-size: 16px; letter-spacing: 0.04em;
    box-shadow: 0 10px 24px -8px rgba(47,143,214,0.6);
    transition: transform 0.08s ease, opacity 0.2s ease;
  }
  .spinbtn:active{ transform: scale(0.96); }
  .spinbtn:disabled{ opacity: 0.55; pointer-events: none; }

  /* ---------- Result banner ---------- */
  .result{
    margin-top: 24px;
    background: linear-gradient(180deg, var(--panel), #0a1526);
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 12px;
    text-align: left;
    opacity: 0; transform: translateY(8px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .result.show{ opacity: 1; transform: translateY(0); }
  .result-icon{
    width: 44px; height: 44px; border-radius: 50%; flex: 0 0 auto;
    background: #0d1626; border: 1px solid var(--panel-edge);
    display:flex; align-items:center; justify-content:center; overflow: hidden;
  }
  .result-icon img{ width: 100%; height: 100%; object-fit: cover; }
  .result-icon .nsc-mini{ font-weight: 800; font-size: 15px; color: var(--silver); }
  .result-text{ min-width: 0; }
  .result-title{
    font-weight: 700; font-size: 15px; color: var(--cyan);
    margin-bottom: 2px;
  }
  .result-sub{ font-size: 12px; color: var(--muted); }

  .legend2{
    margin-top: 18px;
    font-size: 11.5px; color: var(--faint);
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
  }
  .legend2 span{ display:inline-flex; align-items:center; gap: 5px; }

  .note{
    margin-top: 26px;
    font-size: 11px; color: var(--faint);
    line-height: 1.5;
    padding: 0 6px;
  }

  @media (max-width: 340px){
    h1{ font-size: 28px; }
    .coin{ width: 200px; height: 200px; }
    .tails-nsc{ font-size: 38px; }
  }
</style>
</head>

<script>

  var coin = document.getElementById('coin');
  var spinBtn = document.getElementById('spinBtn');
  var result = document.getElementById('result');
  var resultIcon = document.getElementById('resultIcon');
  var resultTitle = document.getElementById('resultTitle');
  var resultSub = document.getElementById('resultSub');

  var totalRotation = 0; // track accumulated rotation so each spin keeps turning forward
  var spinning = false;

  function vibrate(ms){ if (navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }

  spinBtn.addEventListener('click', function(){
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = 'Spinning…';
    result.classList.remove('show');

    var landsOnTails = Math.random() < 0.5;
    // always add multiple full spins, land on 0 (heads) or 180 (tails) offset from current
    var extraSpins = 5; // full rotations for a good 4s spin feel
    var targetOffset = landsOnTails ? 180 : 0;
    // normalize current rotation to 0/180 baseline, then add spins + offset
    var current = totalRotation % 360;
    var currentFace = current >= 90 && current < 270 ? 180 : 0;
    var delta = (extraSpins * 360) + ((targetOffset - currentFace + 360) % 360);
    totalRotation += delta;

    coin.style.transform = 'rotateY(' + totalRotation + 'deg)';
    vibrate(10);

    setTimeout(function(){
      vibrate(landsOnTails ? [20,30,20] : [20,30,20,30,20]);
      showResult(landsOnTails);
      spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = 'Spin Again';
    }, 4050);
  });
